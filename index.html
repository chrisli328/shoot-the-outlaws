<script>
'use strict';
// ================= Basics =================
const QS=new URLSearchParams(location.search);
const QA=window.__PROTO_QA||null;
const AUTO=QS.get('auto')==='1', FIXED=QS.get('fixed')==='1';
const BOTMODE=QA?(QA.bot||'good'):(AUTO&&QS.get('nobot')!=='1'?(QS.get('bot')||'good'):null);
const STOPAT=QS.has('stopAt')?+QS.get('stopAt'):null,MANUAL=QS.get('manual')==='1';
const BOTWAIT=QS.has('botwait')?+QS.get('botwait'):0; // test only: bot pauses on a tutorial step so frames can show the hand
let SEED0=QA&&QA.seed!=null?(+QA.seed|0):(QS.has('seed')?(+QS.get('seed')|0):(FIXED?1:(Math.random()*1e9|0)));
const FPS=60,f=n=>n/FPS;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),lerp=(a,b,k)=>a+(b-a)*k;
const E={lin:k=>k,out:k=>1-Math.pow(1-k,3),in:k=>k*k*k,out2:k=>1-(1-k)*(1-k),io:k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,fly:k=>1.2*k-.2*k*k,
  bounce:k=>{const n=7.5625,d=2.75;if(k<1/d)return n*k*k;if(k<2/d)return n*(k-=1.5/d)*k+.75;if(k<2.5/d)return n*(k-=2.25/d)*k+.9375;return n*(k-=2.625/d)*k+.984375;}};
const prog=(t,t0,d,e)=>(e||E.lin)(clamp((t-t0)/d,0,1));
function kf(t,K){if(t<=K[0][0])return K[0][1];for(let i=1;i<K.length;i++){if(t<=K[i][0]){const a=K[i-1],b=K[i];return lerp(a[1],b[1],(t-a[0])/(b[0]-a[0]));}}return K[K.length-1][1];}
const kfF=(tau,K)=>kf(tau*FPS,K);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const FONT='"Arial Rounded MT Bold","Arial Black",sans-serif';

// ===== Frame-by-frame timings measured from the reference (same as greybox) =====
const K_COMBO=[[0,.73],[1,1.22],[2,1.28],[3,1.19],[4,1.12],[5,1.05],[6,.95],[7,.95],[8,.98],[9,1],[61,.99],[62,.98],[63,.96],[64,.94],[65,.81],[66,.67],[67,.52],[68,0]];
const K_FLASH=[[0,0],[1,.55],[2,1],[3,.8],[4,.88],[5,.63],[6,.48],[7,.17],[8,.08],[9,.03],[10,0]];
const K_DMG=[[0,0],[1,6],[2,4],[3,3],[4,4],[5,2],[6,3],[7,0],[8,-1],[9,-3],[10,-8],[11,-10],[12,-15],[13,-17],[14,-17],[15,-21],[16,-22],[17,-24],[32,-30]];
const VIG=[21.9,54.1,75.5,80.9,81.8,82.3,81.6,80.8,79.7,77.8,74.9,73.8,69.8,68,66,62.4,60.8,57.4,52,50.5,46.3,42,38,33.3,30.4,25.5,20.9,17.3,12.5,9.1,4.5,1.3,-3.6,-8.5,-11.1,-15.2,-17.6,-22.6,-25.6,-28.2,-29.5,-32.2];
const K_VIG=VIG.map((v,i)=>[i,clamp((v+32.2)/114.5,0,1)]);
const K_SHX=[[0,-.3],[1,1.1],[2,-.2],[3,.5],[4,.3],[5,-.1],[6,0]];
const K_KICK=[[0,0],[1,-34],[4,-34],[6,-22],[11,-22],[25,0]];
const K_KROT=[[0,0],[1,-14],[4,-14],[6,-7],[11,-7],[25,0]];
const K_CKICK=[[0,0],[1,-16],[3,-16],[5,-9],[14,0]];
const K_CROT=[[0,0],[1,-6],[3,-6],[5,-3],[14,0]];
const K_LSY=[[0,.88],[2,.68],[5,1]],K_LSX=[[0,1],[2,1],[5,1.1],[8,1.1],[11,1]];
const K_POP=[[0,0],[3,1.15],[5,1]];

// ===== Spherical world (round 8 measurements) =====
const CX=300,Y0=223,FL=359,RR=12.6;
function P3(l,s,h){const th=s/RR,ph=l/RR,r=RR+(h||0),c=Math.cos(ph);return [r*Math.sin(ph),RR+1-r*c*Math.cos(th),r*c*Math.sin(th)];}
function PJ(p){return [CX+FL*p[0]/p[2],Y0+FL*p[1]/p[2],p[2]];}
const scr=(l,s,h)=>PJ(P3(l,s,h));
const SS=(()=>{let a=.3,b=4.8;for(let i=0;i<60;i++){const m=(a+b)/2;if(scr(0,m,0)[1]>430)a=m;else b=m;}return (a+b)/2;})();
const HB=.76,ZN=.35,ZR=16,EL=.02;
const wz=(z0,d)=>((z0-d)%ZR+ZR)%ZR+ZN;
const WT=1.9,WA=f(8),WDD=f(5),WDIST=7.4,WV=WDIST/(WT-WA/2-WDD/2);
function walkD(tw){if(tw<=0)return 0;if(tw>=WT)return WDIST;if(tw<WA)return WV*tw*tw/(2*WA);const dA=WV*WA/2;if(tw<WT-WDD)return dA+WV*(tw-WA);const r=WT-tw;return WDIST-WV*r*r/(2*WDD);}

// ===== Rules (settings panel can change some) =====
const TYPES_ALL=['lead','steel','fire','gold','buck','silver'];
const BASE={lead:10,steel:9,fire:8,gold:10,buck:6,silver:9};
const CHIP={lead:3,steel:3,fire:2,gold:3,buck:2,silver:3};
const MULTS=[1,1.25,1.5,2];
const ROSTER=[{type:'gun',hp:90,dmg:12},{type:'barrel',hp:90,dmg:12},{type:'gun',hp:100,dmg:14},{type:'dyn',hp:115,dmg:20},{type:'pete',hp:205,dmg:16,bounty:1000}];
const GROUPS={4:{lead:5,steel:4,fire:4,gold:4},5:{lead:4,steel:3,fire:3,gold:3,buck:4},6:{lead:3,steel:3,fire:3,gold:3,buck:3,silver:2}};
const TOOLSET={0:[0,0,0],1:[2,1,1],2:[4,2,2]};
const NCH=6; // six-chamber revolver cylinder
const CFG={types:5,hpMul:1,tools:1,chip:1,drawT:1.4,hints:true,slow:QS.get('slow')==='1',sound:true};
if(QS.has('types'))CFG.types=clamp(+QS.get('types')|0,4,6);
if(QS.has('draw'))CFG.drawT=clamp(+QS.get('draw'),.3,2);
if(QS.get('hints')==='0')CFG.hints=false;
if(QS.has('tools'))CFG.tools=clamp(+QS.get('tools')|0,0,2);
const DIFF=QA&&QA.difficulty!=null?+QA.difficulty:(QS.has('difficulty')?+QS.get('difficulty'):1);
const ANC={gun_idle:[102,252],gun_draw:[105,256],gun_hit:[116,256],gun_tied:[105,249],barrel:[90,245],barrel_broken:[216,249],dyn:[100,233],pete_idle:[141,300],pete_draw:[168,301],pete_hit:[126,298],pete_tied:[119,298],boom:[145,243]};
const KGUN=HB/251,KPETE=HB*1.15/299;
const CROP={saloon:[.009,.991,.99],store:[.012,.986,.988],jail:[.011,.987,.986],barn:[.013,.987,.99],sheriff:[.009,.991,.983],shop:[.015,.985,.988],hotel:[.015,.985,.99],bank:[.011,.989,.99],adobe:[.01,.988,.976],awning:[.012,.988,.99]};

// ===== Fixed board: 51 tiles in 4 layers =====
const LAY=[];
for(const hy of [0,2,4])for(let hx=0;hx<=14;hx+=2)LAY.push({hx,hy,z:0});
for(const hy of [1,3])for(let hx=1;hx<=13;hx+=2)LAY.push({hx,hy,z:1});
for(let hx=2;hx<=12;hx+=2)LAY.push({hx,hy:2,z:2});
for(const hy of [0,4])for(const hx of [6,8])LAY.push({hx,hy,z:2});
for(const hx of [5,7,9])LAY.push({hx,hy:2,z:3});
const NT=LAY.length;
LAY.forEach(p=>{p.cx=94+30*p.hx;p.cy=681.4+31.4*p.hy-3*p.z;});
const COVER=LAY.map(a=>LAY.map((b,j)=>j).filter(j=>LAY[j].z>a.z&&Math.abs(LAY[j].hx-a.hx)<2&&Math.abs(LAY[j].hy-a.hy)<2));
const UNDER=LAY.map((a,i)=>LAY.map((b,j)=>j).filter(j=>COVER[j].includes(i)));
const BYZ=[0,1,2,3].map(z=>LAY.map((p,i)=>i).filter(i=>LAY[i].z===z));
const BOARDS={};
function genBoard(nt){if(BOARDS[nt])return BOARDS[nt];const r=mulberry(20261113+nt);
  const init=[];for(let i=0;i<NT;i++)if(!COVER[i].length)init.push(i);
  for(let att=0;att<2000;att++){
    const gone=new Array(NT).fill(false),order=[];
    for(const i of shuffle(init.slice(),r).slice(0,3)){gone[i]=true;order.push(i);}
    while(order.length<NT){const fr=[];for(let i=0;i<NT;i++)if(!gone[i]&&COVER[i].every(j=>gone[j]))fr.push(i);const i=fr[Math.floor(r()*fr.length)];gone[i]=true;order.push(i);}
    const grp=[0,0,0],gsz=[3];let open=[],ng=1;
    for(let p=3;p<NT;p++){const R=NT-p,need=open.reduce((a,g)=>a+3-gsz[g],0),occ=open.reduce((a,g)=>a+gsz[g],0);let doOpen;
      if(!open.length)doOpen=true;else if(R<need+3)doOpen=false;else if(occ>=4)doOpen=false;else if(occ<2)doOpen=r()<.75;else doOpen=r()<.5;
      if(doOpen){grp[p]=ng;gsz[ng]=1;open.push(ng);ng++;}
      else{let cand=open;if(occ>=4){const two=open.filter(g=>gsz[g]===2);if(two.length)cand=two;}const g=cand[Math.floor(r()*cand.length)];grp[p]=g;gsz[g]++;if(gsz[g]===3)open=open.filter(x=>x!==g);}}
    if(ng!==NT/3||open.length)continue;
    const cnt=Object.assign({},GROUPS[nt]),gt=new Array(ng);gt[0]='lead';cnt.lead--;
    const place=(t,lo,hi)=>{const c=shuffle([...Array(ng).keys()].filter(g=>g>=lo&&g<=hi&&gt[g]==null),r).slice(0,cnt[t]);c.forEach(g=>gt[g]=t);cnt[t]-=c.length;};
    place('steel',1,6);place('fire',9,13);
    const rest=[];for(const t in cnt)for(let k=0;k<cnt[t];k++)rest.push(t);shuffle(rest,r);let k=0;for(let g=1;g<ng;g++)if(gt[g]==null)gt[g]=rest[k++];
    if(gt.some(x=>x==null))continue;
    const types=new Array(NT);order.forEach((ti,p)=>types[ti]=gt[grp[p]]);
    // verify: each type a multiple of 3, and the planned order never holds more than 5 in the belt
    const tc={};types.forEach(t=>tc[t]=(tc[t]||0)+1);if(Object.values(tc).some(v=>v%3))continue;
    let occ=0,maxOcc=0;const held={};let ok=true;for(const ti of order){const t=types[ti];held[t]=(held[t]||0)+1;occ++;if(held[t]===3){held[t]=0;occ-=3;}maxOcc=Math.max(maxOcc,occ);if(occ>5){ok=false;break;}}
    if(!ok)continue;
    return BOARDS[nt]={order,types,maxOcc,att};}
  throw new Error('board generation failed');}

// ================= Art =================
const NAMES=['gun_idle','gun_draw','gun_hit','gun_tied','barrel','barrel_broken','dyn','boom','pete_idle','pete_draw','pete_hit','pete_tied',
 'b_lead','b_steel','b_fire','b_gold','b_buck','b_silver','k_lead','k_steel','k_fire','k_gold','k_buck','k_silver',
 'hand_gun2','hand_lasso2','lasso_thrown','muzzle','star','coin','hp_enemy_frame','hp_fill','hp_player_frame','hp_pfill',
 'coin_counter_blank','combo_blank','gear','cell_done','cell_cur','cell_todo','panel2','cyl_empty','holster3',
 'badge_skull','badge_gun','crosshair','ricochet','heart_broken','crate_empty','stun_stars','btn_holster','btn_undo','btn_shuffle','hand_point','badge_alert',
 'u_poster_pete','u_dead','u_captured','u_continue','u_retry','u_medal','u_plank','u_fire',
 'f_saloon','f_store','f_jail','f_barn','f_sheriff','f_shop','f_hotel','f_bank','f_adobe','f_awning',
 'p_barrel','p_crates','p_cactus','p_tumble','p_rock1','p_rock2','p_rock3','p_lamp','p_grass1','p_grass2','p_grass3','p_rail','p_trough','p_wheel','ground','sky'];
const IMG={},DER={};
function loadAll(onp){let n=0;return Promise.all(NAMES.map(nm=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{IMG[nm]=im;onp(++n/NAMES.length);res();};im.onerror=()=>rej(nm);im.src='art/'+nm+(nm==='ground'||nm==='sky'?'.jpg':'.png');})));}
function mkC(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function recolor(im,fn){const c=mkC(im.width,im.height),x=c.getContext('2d');x.drawImage(im,0,0);try{const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4)fn(p,i);x.putImageData(d,0,0);}catch(e){}return c;}
const silverize=(p,i)=>{const r=p[i],g=p[i+1],b=p[i+2];if(Math.abs(r-g)<14&&Math.abs(g-b)<18&&r>90){p[i]=Math.min(255,r*1.05+10);p[i+1]=Math.min(255,g*1.08+18);p[i+2]=Math.min(255,b*1.1+45);}};
const grey=(p,i)=>{const l=.3*p[i]+.59*p[i+1]+.11*p[i+2];p[i]=p[i+1]=p[i+2]=l*.8;};
function derive(){
  IMG.b_silver=recolor(IMG.b_silver,silverize);IMG.k_silver=recolor(IMG.k_silver,silverize);
  for(const t of TYPES_ALL){DER['w_'+t]=recolor(IMG['k_'+t],(p,i)=>{p[i]=p[i+1]=p[i+2]=255;});DER['d_'+t]=recolor(IMG['b_'+t],(p,i)=>{p[i]*=.55;p[i+1]*=.55;p[i+2]*=.55;});}
  DER.tshadow=recolor(IMG.b_lead,(p,i)=>{p[i]=p[i+1]=p[i+2]=0;});
  const red=(p,i)=>{const l=(.3*p[i]+.59*p[i+1]+.11*p[i+2])/255;p[i]=Math.min(255,90+200*l);p[i+1]=25*l;p[i+2]=35*l;};
  DER.hp_fill_r=recolor(IMG.hp_fill,red);DER.hp_pfill_r=recolor(IMG.hp_pfill,red);
  DER.star_off=recolor(IMG.star,(p,i)=>{const l=(.3*p[i]+.59*p[i+1]+.11*p[i+2])*.45;p[i]=p[i+1]=p[i+2]=l;});
  DER.counter_hi=recolor(IMG.coin_counter_blank,(p,i)=>{p[i]=Math.min(255,p[i]+70);p[i+1]=Math.min(255,p[i+1]+70);p[i+2]=Math.min(255,p[i+2]+50);});
  DER.cyl_red=recolor(IMG.cyl_empty,(p,i)=>{p[i]=Math.min(255,p[i]*.6+120);p[i+1]*=.42;p[i+2]*=.42;});
  for(const b of ['holster','undo','shuffle'])DER['g_'+b]=recolor(IMG['btn_'+b],grey);
}
const tileImg=t=>IMG['b_'+t],bulletImg=t=>IMG['k_'+t];

// ================= Screen =================
const stage=document.getElementById('stage'),cv=document.getElementById('cv'),ui=document.getElementById('ui');
const ctx=cv.getContext('2d');
let SC=1,DPR=1,glc=null,gl=null,GL2=false;
function fit(){const W=window.innerWidth,H=window.innerHeight;SC=Math.min(W/608,H/1080);DPR=Math.min(2,window.devicePixelRatio||1);
  stage.style.width=608*SC+'px';stage.style.height=1080*SC+'px';stage.style.left=(W-608*SC)/2+'px';stage.style.top=(H-1080*SC)/2+'px';
  cv.width=Math.round(608*SC*DPR);cv.height=Math.round(1080*SC*DPR);
  if(glc){glc.width=Math.round(608*SC*DPR);glc.height=Math.round(600*SC*DPR);}
  ui.style.transform=`scale(${SC})`;}
window.addEventListener('resize',fit);

// ================= WebGL world =================
const PJU=[2*FL/608,2*CX/608-1,2*FL/600,1-2*Y0/600];

    const bl=barrel&&type!=='steel';o.blocked.push(bl);o.dmg.push(bl?0:Math.round(BASE[type]*mult*(type==='silver'&&en.type==='pete'?2:1)));if(type==='steel')barrel=false;}
  return o;}
function chipDmg(t,en){if(!en||!CFG.chip)return 0;if(en.barrel&&t!=='steel')return 0;return Math.round(CHIP[t]*CFG.chip*(t==='silver'&&en.type==='pete'?2:1));}
function pending(){const en=G.en;if(!en)return 0;let p=0;if(G.seq&&G.seq.en===en)p+=G.seq.pend;
  const landed=G.belt.filter(it=>!it.ghost&&!it.inc),c=counts(landed);
  for(const t of TYPES_ALL)if(c[t]>=3){const pl=comboPlan(t,en,MULTS[Math.min(G.combo,3)]);p+=pl.dmg.reduce((a,b)=>a+b,0);}
  for(const it of G.belt)if(!it.chipDone&&!it.ghost)p+=chipDmg(it.t,en);return p;}
function canAct(){if(!G||paused||TRANS||now<G.busyT)return false;const p=G.phase;return p==='play'||p==='walk'||p==='dying'||p==='lasso'||(p==='intro'&&now>=G.introT+1.25);}
// damage already on its way (shots in the air, chip shots not landed): a ready triple waits instead of overkilling
function committed(){const en=G.en;if(!en)return 0;let p=0;if(G.seq&&G.seq.en===en)p+=G.seq.pend;for(const it of G.belt)if(!it.chipDone&&!it.ghost)p+=chipDmg(it.t,en);return p;}
function addToBelt(t,from,noTile){let idx=-1;G.belt.forEach((it,j)=>{if(!it.ghost&&it.t===t)idx=j;});let ins=idx>=0?idx+1:G.belt.length;
  while(G.belt.length>=G.N){const g=G.belt.findIndex(it=>it.ghost);if(g<0)break;dropGhost(G.belt[g]);if(g<ins)ins--;}
  const item={id:++UID,t,inc:true,ghost:false,gone:false,tapT:now,landT:now+f(noTile?15:19),from,noTile,chipDone:false,sf:{from:ins,to:ins,t0:0,dur:1}};
  G.belt.splice(ins,0,item);reindex(f(9),item);SFX.tap();
  at(now+f(4),T=>chipShot(item,T));at(item.landT,T=>land(item,T));return item;}
function beltRoom(){if(nonGhost().length<G.N)return true;if(G.stuck){G.beltShakeT=now;SFX.buzz();}return false;}
function takeTile(tl){if(!tl||tl.gone||tl.pend||covered(tl)||!canAct())return false;if(!beltRoom())return false;
  tl.gone=true;for(const j of UNDER[tl.i]){const u=G.tiles[j];if(!u.gone&&!covered(u))u.uncT=now;}
  const item=addToBelt(tl.t,[tl.cx,tl.cy],false);G.hist.push({tile:tl,item});
  G.log.push(['tap',+now.toFixed(3),tl.t]);tutAfter('tile',tl);return true;}
function takeHol(i){const h=G.hol[i];if(!h||now<h.t0+f(12)||!canAct())return false;if(!beltRoom())return false;G.hol[i]=null;addToBelt(h.t,[HOLX[i],HOLY],true);G.log.push(['holtap',+now.toFixed(3),h.t]);return true;}
function dropGhost(it){it.pos=chXY(cylSlot(it));it.removed=true;const j=G.belt.indexOf(it);if(j>=0)G.belt.splice(j,1);}
function land(item,T){if(!G.belt.includes(item))return;item.inc=false;item.landT=T;SFX.land();checkTriples(T);checkStuck(T);
  const ng=nonGhost();if(G.tut&&!G.tut.cur&&!G.tut.done.cyl5&&G.phase==='play'&&ng.length===G.N-1&&!hasTriple(ng))tutShow('cyl5',{kind:'show',holes:[{c:[CYL.x,CYL.y,98]}],until:now+1.3});}
function undoTarget(){for(let k=G.hist.length-1;k>=0;k--){const it=G.hist[k].item;if(it.inc)return null;if(G.belt.includes(it)&&!it.ghost&&!it.gone)return G.hist[k];}return null;}
function holsterOk(){return G.tools.holster>0&&!G.hol.some(h=>h)&&G.belt.some(it=>!it.ghost&&!it.inc);}
function toolUsable(){return (G.tools.undo>0&&!!undoTarget())||holsterOk();}
function checkStuck(T){if(G.phase==='lost'||G.phase==='win')return;const ng=nonGhost();
  if(ng.length>=G.N&&!ng.some(it=>it.inc)&&!hasTriple(ng)){if(toolUsable()){if(!G.stuck){G.stuck={t:now};SFX.buzz();}}else{G.stuck=null;loseGame('CYLINDER FULL',T==null?now:T);}}

// ----- Tools -----
function toolPhaseOk(){return !paused&&!TRANS&&(G.phase==='play'||G.phase==='walk'||G.phase==='dying'||G.phase==='intro')&&now>=G.busyT;}
function useUndo(){if(G.tools.undo<=0||!toolPhaseOk())return null;let h=null;
  while(G.hist.length){const x=G.hist[G.hist.length-1];if(x.item.inc)return null;G.hist.pop();if(G.belt.includes(x.item)&&!x.item.ghost&&!x.item.gone){h=x;break;}}
  if(!h)return null;G.tools.undo--;const it=h.item,tl=h.tile;const from=chXY(cylSlot(it));G.belt.splice(G.belt.indexOf(it),1);reindex(0);
  tl.t=it.t;tl.gone=false;tl.pend=true;tl.retT=now;tl.uncT=null;G.returns.push({tl,t:it.t,from,to:[tl.cx,tl.cy],t0:now});
  at(now+f(19),()=>{tl.pend=false;tl.retT=null;});G.stuck=null;SFX.undo();G.log.push(['undo',+now.toFixed(3),it.t]);tutAfter('tool');checkStuck(now);return tl;}
function useHolster(){if(!holsterOk()||!toolPhaseOk())return false;const cand=G.belt.filter(it=>!it.ghost&&!it.inc).slice(0,3);
  G.tools.holster--;cand.forEach((it,k)=>{const from=chXY(cylSlot(it));G.belt.splice(G.belt.indexOf(it),1);G.hol[k]={t:it.t,from,t0:now};});reindex(0);
  G.hist=G.hist.filter(h=>!cand.includes(h.item));G.stuck=null;SFX.ui();G.log.push(['holster',+now.toFixed(3),cand.map(x=>x.t).join(',')]);tutAfter('tool');checkStuck(now);return true;}
function useShuffle(){if(G.tools.shuffle<=0||!toolPhaseOk())return false;const left=G.tiles.filter(t=>!t.gone&&!t.pend);if(left.length<2)return false;G.tools.shuffle--;
  const ts=shuffle(left.map(t=>t.t),rng);left.forEach((tl,k)=>{tl.flipT=now;tl.flipTo=ts[k];});at(now+.2,()=>{left.forEach(tl=>{tl.t=tl.flipTo;});});
  G.busyT=now+.4;SFX.shuffle();G.log.push(['shuffle',+now.toFixed(3)]);return true;}
// ----- Chip shot on every tap -----
function chipShot(it,T){it.chipDone=true;const en=G.en;
  if(CFG.chip){G.ckickT=T;SFX.chip();}
  if(!enemyAlive(en)||G.phase!=='play'||G.lassoThrow)return;
  if(CFG.chip){const p=CHXY[G.chipN++%CHXY.length];en.flashes.push(T);
    if(en.barrel&&it.t!=='steel'){SFX.block();addFx('world',T+f(2),.45,a=>ricoFx(p[0],p[1],a,.8));}
    else{if(en.barrel&&it.t==='steel'){en.barrel=false;en.brokeT=T;SFX.block();}
      const d=chipDmg(it.t,en);if(en.chunkFrom==null)en.chunkFrom=en.hp;en.hp=Math.max(0,en.hp-d);en.chunkT=T+.3;SFX.hit();
      addFx('world',T+f(3),.5,a=>dmgText('-'+d,p[0],p[1],a,'#e8343a',20));
      if(en.hp<=0){kill(T+f(38));return;}}}
  burnTick(T);checkTriples(T);}
function burnTick(T){const en=G.en;if(!enemyAlive(en)||en.burn<=0)return;en.burn--;if(en.chunkFrom==null)en.chunkFrom=en.hp;en.hp=Math.max(0,en.hp-3);en.chunkT=T+.3;SFX.burn();
  addFx('world',T+f(6),.55,a=>dmgText('-3',350,330,a,'#ff8a1e',20));if(en.hp<=0)kill(T+f(38));}
// ----- Match 3: fire three shots -----
function targetable(){const en=G.en;return G.phase==='play'&&enemyAlive(en)&&!G.lassoThrow;}
function checkTriples(T){if(G.seq&&T<G.seq.t0+f(20))return;if(!targetable())return;if(G.en.hp-committed()<=0)return;
  const landed=G.belt.filter(it=>!it.ghost&&!it.inc),c=counts(landed);const t=TYPES_ALL.find(x=>c[x]>=3);if(!t)return;
  startFire(landed.filter(it=>it.t===t).slice(0,3),T);}
function startFire(items,T){const en=G.en,type=items[0].t;items.forEach(it=>{it.ghost=true;it.fireT=T;});
  G.combo++;const mult=MULTS[Math.min(G.combo,4)-1];const pl=comboPlan(type,en,mult);
  const seq={t0:T,items,type,mult,en,shots:[T+f(8),T+f(14),T+f(20)],dmg:pl.dmg,blocked:pl.blocked,boom:pl.boom,pend:0};
  seq.pend=seq.dmg.reduce((a,b)=>a+b,0);G.seq=seq;
  if(en.drawT!=null&&!en.fired){en.drawT=null;en.fired=true;en.beatT=T;en.stopT=T;G.saved={t:T,loss:Math.min(G.php,en.dmg)/G.phpMax};SFX.block();G.log.push(['stop',+T.toFixed(3),type]);if(type==='buck')en.stunT=T;}

  at(seq.shots[2]+f(6),T4=>{if(G.lasso<3){G.lasso++;const i=G.lasso-1,tx=90+i*30,ty=370,FL=.42;G.lassoPopT=T4+FL;addFx('box',T4,FL,a=>{ctx.save();ctx.shadowColor='rgba(255,220,120,1)';ctx.shadowBlur=18;for(let j=3;j>=0;j--){const kk=E.io(clamp(a/FL-j*.07,0,1));if(a/FL-j*.07<0)continue;const x=lerp(CYL.x,tx,kk),y=lerp(CYL.y-10,ty,kk)-Math.sin(kk*Math.PI)*90;ctx.globalAlpha=j?.45/j:1;dW(IMG.star,x,y,lerp(54,26,kk)*(j?.7:1));}ctx.restore();});}afterCombo(seq,T4);});
  at(T+f(20)+1e-4,T5=>{if(G.seq===seq)G.seq=null;checkTriples(T5);});
  G.log.push(['fire',+T.toFixed(3),type,mult]);}
function addFx(layer,t0,dur,draw){G.fx.push({layer,t0,dur,draw});}
const DMGX=[262,350,306],DMGY=[300,286,268];
function shot(seq,j,T){const it=seq.items[j],pos=it.removed?it.pos:chXY(cylSlot(it));it.gone=true;
  G.rotFrom=cylRot();G.rotTo+=60;G.rotT0=T;
  addFx('box',T,f(10),a=>{const k=a/f(10),r=lerp(16,40,k);ctx.save();ctx.globalAlpha=1-k;const g=ctx.createRadialGradient(pos[0],pos[1],0,pos[0],pos[1],r);g.addColorStop(0,'rgba(255,252,230,1)');g.addColorStop(.45,'rgba(255,205,90,.85)');g.addColorStop(1,'rgba(255,150,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(pos[0],pos[1],r,0,Math.PI*2);ctx.fill();ctx.restore();});
  G.kickT=T;G.shots++;SFX.shot();
  const en=seq.en;if(G.en!==en||!enemyAlive(en))return;
  en.flashes.push(T);
  if(seq.boom===j){en.boomT=T;seq.pend=0;en.hp=0;SFX.boom();G.shakeT=T;G.shakeAmp=4;
    kill(T+f(20));return;}
  const d=seq.dmg[j];seq.pend-=d;
  if(seq.blocked[j]){SFX.block();addFx('world',T+f(4),.5,a=>ricoFx(DMGX[j],DMGY[j],a,1));return;}
  if(seq.type==='steel'&&en.barrel){en.barrel=false;en.brokeT=T;SFX.block();}
  if(en.chunkFrom==null)en.chunkFrom=en.hp;en.chunkT=null;en.hp=Math.max(0,en.hp-d);SFX.hit();
  addFx('world',T+f(5),.55,a=>dmgText('-'+d,DMGX[j],DMGY[j],a));
  if(j===2||en.hp<=0)en.chunkT=T+.3;
  if(en.hp<=0){if(seq.type==='gold')en.goldKill=true;kill(T+f(38));return;}
  if(j===2){if(seq.type==='fire')en.burn=3;
    if(seq.type==='buck'){en.stunT=T;if(en.drawT!=null&&!en.fired){en.drawT=null;en.fired=true;}}}}

function startDraw(en,T){en.drawT=T;en.fireT=T+CFG.drawT;en.fired=false;const id=++en.drawId;SFX.alert();at(en.fireT,T2=>enemyFire(en,T2,id));

function tutHold(){const c=G&&G.tut&&G.tut.cur;if(!c||!c.hold)return false;if(c.tile&&(c.tile.gone||covered(c.tile))){G.tut.cur=null;return false;}return true;}

function tutCheck(){const c=G.tut&&G.tut.cur;if(!c)return;
  if(G.phase==='lost'||G.phase==='win'){G.tut.cur=null;return;}

  else if(c.wait==='lasso'&&!G.lassoThrow&&(G.lasso<3||!enemyAlive(G.en)||G.en.hp>.25*G.en.max)){G.tut.cur=null;G.tut.done.lasso=false;}

function tutTile(tl,then,more){return {kind:'act',wait:'tile',tile:tl,holes:[{c:[tl.cx,tl.cy,42]}].concat(more||[]),point:[tl.cx,tl.cy-4],then};}
function tutStart(){const ng=nonGhost(),c=counts(ng);if(hasTriple(ng)){G.tut.done.tap=true;return;}

    if(r==='CYLINDER FULL'){const s=.8*k;dI(DER.cyl_red,304,500,s,s,1);G.belt.filter(it=>!it.ghost).forEach((it,j)=>{const a=(-90+j*60)*Math.PI/180;dW(bulletImg(it.t),304+.7*s+52.5*s*Math.cos(a),500-s+52.5*s*Math.sin(a),40*s,1);});}
    else dW(r==='OUT OF HEALTH'?IMG.heart_broken:IMG.crate_empty,304,500,150*k,1);}
  if(t>=.35)for(let i=0;i<5;i++){const t0=.35+i*.05,k=kf(t,[[t0,0],[t0+.05,1.2],[t0+.1,1]]);if(k<=0)continue;const x=304+(i-2)*46,im=i<G.cells?IMG.cell_done:(i===G.cells?IMG.cell_cur:IMG.cell_todo);dI(im,x,652,.8*k,.8*k,1);if(i===4)dI(IMG.star,x,651,.14*k,.14*k,1);}
  if(t>=.6){const k=kf(t,[[.6,.6],[.617,1.12],[.65,1]]);dI(IMG.u_retry,304,760,.55*k,.55*k,1);}}
function drawTrans(){if(!TRANS)return;const t=now-TRANS.t0;const a=t<.1?0:t<.266?(t-.1)/.166:t<.6?1:clamp(1-(t-.6)/.133,0,1);if(a<=0)return;ctx.fillStyle=`rgba(26,15,12,${a})`;ctx.fillRect(0,0,608,1080);}
function draw(){ctx.setTransform(SC*DPR,0,0,SC*DPR,0,0);ctx.clearRect(0,0,608,1080);if(!G)return;
  let shx=0;if(G.shakeT!=null)shx=kfF(now-G.shakeT,K_SHX)*G.shakeAmp;
  ctx.save();ctx.translate(shx,0);
  ctx.save();ctx.beginPath();ctx.rect(0,0,608,600);ctx.clip();drawSky();if(gl){renderGL();ctx.drawImage(glc,0,0,608,600);}
  drawEnemyHud();drawFx('world');drawCombo();drawLassoThrow();drawEnemyAttackFx();drawVignette();ctx.restore();
  drawTop();drawHands();drawPanel();drawBoard();drawCyl();drawTools();drawFx('box');drawFlights();drawCoins();
  ctx.restore();
  drawIntro();drawVictory();drawLose();drawTut();drawTrans();}

// ================= Input =================
function hitBox(x,y,cx,cy,hw,hh){return Math.abs(x-cx)<=hw&&Math.abs(y-cy)<=hh;}
function onTap(x,y){if(!G||paused)return;
  if(Math.hypot(x-50,y-48)<34){openSettings();return;}
  if(TRANS)return;
  const tc=G.tut&&G.tut.cur;
  if(tc&&tc.kind==='act'&&!tc.holes.some(h=>inHole(h,x,y))){tc.nudgeT=RT();SFX.buzz();return;}
  if(G.vic){const t=now-G.vic.t0;if(t>=3.3&&G.vic.outT==null&&hitBox(x,y,304,680,125,50))startTrans();return;}
  if(G.loseT!=null){if(now-G.loseT>=.6&&hitBox(x,y,304,760,135,55))startTrans();return;}
  if(G.phase==='lost')return;
  if(x<230&&y>360&&y<573){if(lassoReady())throwLasso();else{G.lassoNopeT=now;SFX.buzz();}return;}
  if(y>935&&y<1040&&(x<215||x>395)){
    if(Math.abs(x-TOOLX.undo)<43){if(!useUndo())SFX.buzz();return;}
    if(Math.abs(x-TOOLX.shuffle)<43){if(!useShuffle())SFX.buzz();return;}
    if(G.hol.some(h=>h)){for(let i=0;i<3;i++)if(Math.abs(x-HOLX[i])<27){if(G.hol[i])takeHol(i);return;}}
    else if(Math.abs(x-TOOLX.holster)<46){if(!useHolster())SFX.buzz();return;}
    return;}
  if(y>636&&y<880){for(let z=3;z>=0;z--){for(const i of BYZ[z]){const tl=G.tiles[i];if(tl.gone||tl.pend||tl.cashed)continue;if(hitBox(x,y,tl.cx,tl.cy,30,31.4)){
      if(covered(tl)){SFX.buzz();return;}if(G.stuck){G.beltShakeT=now;SFX.buzz();return;}takeTile(tl);return;}}}}}
stage.addEventListener('pointerdown',e=>{if(!started)return;if(e.target.closest&&e.target.closest('.set'))return;const r=cv.getBoundingClientRect();onTap((e.clientX-r.left)/SC,(e.clientY-r.top)/SC);e.preventDefault();});

// ================= Settings =================
let setEl=null;
function openSettings(){if(setEl)return;paused=true;SFX.ui();
  const opt=(lab,key,vals,note)=>`<div class="row"><div class="lab">${lab}${note?` <small>${note}</small>`:''}</div><div class="opts">${vals.map(([v,t])=>`<button data-k="${key}" data-v="${v}" class="${String(CFG[key])===String(v)?'on':''}">${t}</button>`).join('')}</div></div>`;
  setEl=document.createElement('div');setEl.className='shade';
  setEl.innerHTML=`<div class="set"><h2>SETTINGS</h2>
  ${opt('Bullet types','types',[[4,'4'],[5,'5'],[6,'6 (silver)']],'(on restart)')}
  ${opt('Outlaw HP','hpMul',[[.75,'x0.75'],[1,'x1'],[1.25,'x1.25'],[1.5,'x1.5']],'(on restart)')}
  ${opt('Outlaw draw time','drawT',[[1,'1.0s'],[1.4,'1.4s'],[1.8,'1.8s']])}
  ${opt('Hint badges','hints',[[true,'On'],[false,'Off']])}
  ${opt('Tool uses','tools',[[0,'None'],[1,'x1'],[2,'x2']],'(on restart)')}
  ${opt('Chip damage per tap','chip',[[0,'Off'],[1,'x1'],[2,'x2']])}
  ${opt('Slow-mo','slow',[[false,'Off'],[true,'0.25x']])}
  ${opt('Sound','sound',[[true,'On'],[false,'Off']])}
  <div class="btns"><button class="tu" data-act="tut">Replay tutorial</button><button class="re" data-act="restart">Restart</button><button class="ok" data-act="close">Close</button></div></div>`;
  ui.appendChild(setEl);
  setEl.addEventListener('pointerdown',e=>e.stopPropagation());
  setEl.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;let v=b.dataset.v;if(k==='slow'||k==='sound'||k==='hints')v=v==='true';else v=+v;CFG[k]=v;
    setEl.querySelectorAll(`button[data-k="${k}"]`).forEach(x=>x.classList.toggle('on',x===b));SFX.ui();});
  setEl.querySelector('[data-act="close"]').onclick=closeSettings;
  setEl.querySelector('[data-act="restart"]').onclick=()=>{closeSettings();TRANS=null;newLevel(0);};
  setEl.querySelector('[data-act="tut"]').onclick=()=>{try{localStorage.removeItem(TUT_KEY);}catch(e){}TUTON=true;closeSettings();TRANS=null;newLevel(0);};}
function closeSettings(){if(setEl){setEl.remove();setEl=null;}paused=false;last=null;SFX.ui();}

// ================= Main loop =================
let last=null;
function frame(ts){requestAnimationFrame(frame);if(!READY)return;const dt=last==null?0:Math.min(.05,(ts-last)/1000);last=ts;
  if(started&&!paused&&!MANUAL&&BOTMODE&&tutHold())botHold();
  if(started&&!paused&&!MANUAL&&!tutHold()){const sp=CFG.slow?.25:1;let nn=now+dt*sp;if(STOPAT!=null&&nn>STOPAT)nn=STOPAT;if(nn>now){const st=nn-now;now=nn;update(st);}}
  if(!(QA&&QA.draw===false))draw();}
// ================= Start screen =================
const startEl=document.createElement('div');startEl.className='start';
startEl.innerHTML=`<div class="rays"></div><img class="logo" src="art/logo.png" alt="Shoot the Outlaws"><img class="poster" src="art/u_poster_pete.png" alt=""><div class="go wait">LOADING 0%</div><div class="lv">MAIN STREET&nbsp;&nbsp;LEVEL 1</div><div class="msg"></div>`;
if(!QA)ui.appendChild(startEl);
function begin(){if(started)return;started=true;startEl.remove();const a=audio();if(a&&a.resume)a.resume().catch(()=>{});
  TUTON=QS.get('tut')==='1'||(!QA&&!AUTO&&!MANUAL&&!tutSeen());newLevel(.1);last=null;}
fit();
const goEl=startEl.querySelector('.go');
loadAll(p=>{goEl.textContent=`LOADING ${Math.round(p*100)}%`;}).then(()=>{
  derive();buildStreet();genBoard(CFG.types);const ok=initGL();fit();
  if(!ok)startEl.querySelector('.msg').textContent='WebGL is not available, so the street cannot be drawn';
  READY=true;goEl.textContent='PLAY';goEl.className='go ready';
  startEl.addEventListener('pointerdown',e=>{e.stopPropagation();begin();});
  if(AUTO||QA)begin();
}).catch(n=>{goEl.textContent='LOAD FAILED';startEl.querySelector('.msg').textContent=String(n);});
requestAnimationFrame(frame);
window.GAME={tick(n){for(let i=0;i<(n||1);i++){if(BOTMODE&&tutHold())botHold();if(tutHold())break;now+=1/FPS;update(1/FPS);}return now;},draw,adv(sec){const n=Math.round(sec*FPS);for(let i=0;i<n;i++){if(BOTMODE&&tutHold())botHold();if(tutHold())break;now+=1/FPS;update(1/FPS);}draw();return now;},
  tap:onTap,get G(){return G;},get now(){return now;},CFG,SS,LAY,COVER,genBoard,lassoReady,canAct,takeTile,takeHol,useUndo,useHolster,useShuffle,throwLasso,startTrans,covered,pending,tileBadge,chXY,CYL};
</script></body></html>
